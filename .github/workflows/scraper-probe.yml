name: Scraper Testi (GitHub IP'sinden)

# Magaza scraper'lari GitHub Actions runner'inin IP'sinden, proxy'siz
# calisiyor mu? Calisiyorsa onbellek isitma isini (ucretli proxy/scraper
# servisi yerine) dogrudan burada kosturabiliriz. Sadece elle tetiklenir.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe scrapers
        run: python scripts/scraper_probe.py
