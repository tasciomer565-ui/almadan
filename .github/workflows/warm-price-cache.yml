name: Fiyat Sayfaları Önbellek Isıtma

# /fiyat/{terim} SEO sayfalarinin product_cache'ini DOGRUDAN bu runner'dan
# tarayarak isitir (bkz. scripts/warm_price_cache.py).
#
# Eski akis sadece Render'daki /cron/warm-price-terms endpoint'ini
# cagiriyordu: calisma basina 2 terim, ve tarama scraper servisinden
# (ucretli proxy'ye bagimli) geciyordu -- 2026-09 sonunda cogu terimde
# sadece Amazon donuyordu. Runner IP'sinden proxy'siz n11 + Amazon +
# Karaca + SOK calistigi scripts/scraper_probe.py ile dogrulandi; depo
# herkese acik oldugu icin Actions suresi ucretsiz.
on:
  schedule:
    # Saat basi (":00") GitHub'in en yogun ani, zamanlanmis isler sik
    # atlaniyor -- bilerek ":17".
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Bu calismada taranacak en fazla terim"
        default: "240"
      dry_run:
        description: "true ise cache'e yazmaz, sadece ne yazilacagini gosterir"
        default: "false"

concurrency:
  group: warm-price-cache
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Warm price cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LIMIT: ${{ inputs.limit || '240' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          ARGS="--limit $LIMIT"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/warm_price_cache.py $ARGS
