[project]
name = "almadan-scraper-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "fastapi[standard]>=0.115,<1",
    "lxml>=5.3,<7",
    "requests>=2.32,<3",
    "rapidfuzz>=3.6,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
